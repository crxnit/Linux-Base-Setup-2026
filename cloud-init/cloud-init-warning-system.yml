#cloud-config
# =============================================================================
# CLOUD-INIT LOGIN WARNING SYSTEM
# =============================================================================
# Warns users who log in during cloud-init execution that setup is in progress
# =============================================================================

write_files:

  # ===========================================================================
  # LOGIN WARNING SCRIPT
  # ===========================================================================
  
  - path: /etc/profile.d/00-cloud-init-warning.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # CLOUD-INIT LOGIN WARNING
      # =============================================================================
      # This script runs on every interactive login and warns users if cloud-init
      # is still running. It's numbered 00- to run first.
      # =============================================================================
      
      # Only run for interactive shells
      [[ $- == *i* ]] || return
      
      # Check if cloud-init is still running
      CLOUD_INIT_RUNNING=false
      CLOUD_INIT_STATUS=""
      
      # Method 1: Check for cloud-init process
      if pgrep -f "cloud-init" > /dev/null 2>&1; then
          CLOUD_INIT_RUNNING=true
      fi
      
      # Method 2: Check cloud-init status file
      if [[ -f /run/cloud-init/status.json ]]; then
          if command -v jq &>/dev/null; then
              status=$(jq -r '.v1.stage // "done"' /run/cloud-init/status.json 2>/dev/null)
              if [[ "$status" != "null" && "$status" != "done" && -n "$status" ]]; then
                  CLOUD_INIT_RUNNING=true
                  CLOUD_INIT_STATUS="$status"
              fi
          fi
      fi
      
      # Method 3: Check for our custom flag file
      if [[ -f /run/cloud-init-in-progress ]]; then
          CLOUD_INIT_RUNNING=true
      fi
      
      # Method 4: Check if final reboot hasn't happened yet
      if [[ -f /var/lib/cloud/instance/boot-finished ]] && [[ ! -f /var/lib/cloud/instance/hardening-complete ]]; then
          # Cloud-init finished but our hardening reboot hasn't happened
          if [[ -f /run/cloud-init-in-progress ]]; then
              CLOUD_INIT_RUNNING=true
          fi
      fi
      
      # Display warning if cloud-init is running
      if [[ "$CLOUD_INIT_RUNNING" == "true" ]]; then
          # Colors
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          CYAN='\033[0;36m'
          BOLD='\033[1m'
          BLINK='\033[5m'
          NC='\033[0m'
          
          clear
          
          echo ""
          echo -e "${RED}╔══════════════════════════════════════════════════════════════════════════════╗${NC}"
          echo -e "${RED}║${NC}${BOLD}${YELLOW}                                                                              ${NC}${RED}║${NC}"
          echo -e "${RED}║${NC}${BOLD}${YELLOW}    ⚠️  WARNING: SYSTEM INITIALIZATION IN PROGRESS ⚠️                         ${NC}${RED}║${NC}"
          echo -e "${RED}║${NC}${BOLD}${YELLOW}                                                                              ${NC}${RED}║${NC}"
          echo -e "${RED}╠══════════════════════════════════════════════════════════════════════════════╣${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}║${NC}  Cloud-init is currently configuring this server.                           ${RED}║${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}║${NC}  ${BOLD}DO NOT:${NC}                                                                     ${RED}║${NC}"
          echo -e "${RED}║${NC}    • Make configuration changes                                              ${RED}║${NC}"
          echo -e "${RED}║${NC}    • Start services manually                                                 ${RED}║${NC}"
          echo -e "${RED}║${NC}    • Reboot the system                                                       ${RED}║${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}║${NC}  ${BOLD}RECOMMENDED:${NC}                                                                ${RED}║${NC}"
          echo -e "${RED}║${NC}    • Log out and wait for the system to reboot automatically                 ${RED}║${NC}"
          echo -e "${RED}║${NC}    • Reconnect after 5-10 minutes                                            ${RED}║${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}╠══════════════════════════════════════════════════════════════════════════════╣${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          
          # Show current status if available
          if [[ -n "$CLOUD_INIT_STATUS" ]]; then
              printf "${RED}║${NC}  Current stage: %-58s ${RED}║${NC}\n" "$CLOUD_INIT_STATUS"
          fi
          
          # Show progress if log exists
          if [[ -f /var/log/cloud-init-output.log ]]; then
              last_line=$(tail -1 /var/log/cloud-init-output.log 2>/dev/null | cut -c1-60)
              if [[ -n "$last_line" ]]; then
                  printf "${RED}║${NC}  Last activity: %-58s ${RED}║${NC}\n" "$last_line"
              fi
          fi
          
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}║${NC}  ${CYAN}Monitor progress:${NC}  tail -f /var/log/cloud-init-output.log               ${RED}║${NC}"
          echo -e "${RED}║${NC}  ${CYAN}Check status:${NC}      cloud-init status --wait                             ${RED}║${NC}"
          echo -e "${RED}║${NC}                                                                              ${RED}║${NC}"
          echo -e "${RED}╚══════════════════════════════════════════════════════════════════════════════╝${NC}"
          echo ""
          
          # Prompt user
          echo -e "${YELLOW}Press Enter to continue anyway (not recommended) or Ctrl+D to disconnect...${NC}"
          read -r -t 30 || {
              echo ""
              echo -e "${CYAN}Timeout - disconnecting for safety...${NC}"
              sleep 2
              exit 0
          }
          
          echo ""
          echo -e "${YELLOW}⚠️  Proceeding at your own risk. Avoid making changes until setup completes.${NC}"
          echo ""
      fi

  # ===========================================================================
  # PRE-LOGIN BANNER (shown before authentication)
  # ===========================================================================
  
  - path: /etc/issue.net.cloud-init
    owner: root:root
    permissions: '0644'
    content: |
      
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║                                                                              ║
      ║    ⚠️  SYSTEM INITIALIZATION IN PROGRESS                                     ║
      ║                                                                              ║
      ║    This server is being configured automatically.                            ║
      ║    Please wait for initialization to complete before logging in.             ║
      ║                                                                              ║
      ║    The system will reboot automatically when ready.                          ║
      ║    Try again in 5-10 minutes.                                                ║
      ║                                                                              ║
      ╚══════════════════════════════════════════════════════════════════════════════╝
      

  # ===========================================================================
  # NORMAL BANNER (used after cloud-init completes)
  # ===========================================================================
  
  - path: /etc/issue.net.normal
    owner: root:root
    permissions: '0644'
    content: |
      ******************************************************************************
      *                                                                            *
      *  AUTHORIZED ACCESS ONLY                                                    *
      *                                                                            *
      *  This system is for authorized users only. All activity is monitored       *
      *  and logged. Unauthorized access attempts will be reported.                *
      *                                                                            *
      ******************************************************************************

  # ===========================================================================
  # SSH BANNER DURING CLOUD-INIT
  # ===========================================================================
  
  - path: /etc/ssh/banner.cloud-init
    owner: root:root
    permissions: '0644'
    content: |
      
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║                                                                              ║
      ║    ⚠️  WARNING: SYSTEM INITIALIZATION IN PROGRESS                            ║
      ║                                                                              ║
      ║    Cloud-init is currently configuring this server.                          ║
      ║    It is STRONGLY RECOMMENDED that you disconnect and wait.                  ║
      ║                                                                              ║
      ║    The system will reboot automatically when setup is complete.              ║
      ║    Please try again in 5-10 minutes.                                         ║
      ║                                                                              ║
      ╚══════════════════════════════════════════════════════════════════════════════╝
      

  # ===========================================================================
  # NORMAL SSH BANNER (after cloud-init)
  # ===========================================================================
  
  - path: /etc/ssh/banner.normal
    owner: root:root
    permissions: '0644'
    content: |
      ******************************************************************************
      *                                                                            *
      *  AUTHORIZED ACCESS ONLY                                                    *
      *                                                                            *
      *  This system is for authorized users only. All activity is monitored       *
      *  and logged. Unauthorized access attempts will be reported.                *
      *                                                                            *
      ******************************************************************************

  # ===========================================================================
  # MOTD DURING CLOUD-INIT
  # ===========================================================================
  
  - path: /etc/motd.cloud-init
    owner: root:root
    permissions: '0644'
    content: |
      
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║                                                                              ║
      ║    ⚠️  SYSTEM INITIALIZATION IN PROGRESS                                     ║
      ║                                                                              ║
      ║    Please log out and wait for the automatic reboot.                         ║
      ║                                                                              ║
      ╚══════════════════════════════════════════════════════════════════════════════╝
      

  # ===========================================================================
  # CLEANUP SCRIPT (runs after cloud-init completes)
  # ===========================================================================
  
  - path: /usr/local/bin/cloud-init-complete.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # CLOUD-INIT COMPLETION SCRIPT
      # =============================================================================
      # This script is called when cloud-init finishes to:
      # - Remove login warnings
      # - Restore normal banners
      # - Clean up temporary files
      # =============================================================================
      
      set -euo pipefail
      
      LOG_FILE="/var/log/cloud-init-hardening.log"
      
      log() {
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" >> "$LOG_FILE"
          echo "$1"
      }
      
      log "Cloud-init completion script starting..."
      
      # Remove the in-progress flag
      rm -f /run/cloud-init-in-progress
      log "Removed cloud-init-in-progress flag"
      
      # Restore normal SSH banner
      if [[ -f /etc/ssh/banner.normal ]]; then
          cp /etc/ssh/banner.normal /etc/ssh/banner
          log "Restored normal SSH banner"
      fi
      
      # Restore normal issue.net
      if [[ -f /etc/issue.net.normal ]]; then
          cp /etc/issue.net.normal /etc/issue.net
          log "Restored normal issue.net"
      fi
      
      # Clear MOTD cloud-init warning
      if [[ -f /etc/motd.cloud-init ]]; then
          rm -f /etc/motd.cloud-init
      fi
      
      # Remove the profile.d warning script
      # (or modify it to not display warning)
      if [[ -f /etc/profile.d/00-cloud-init-warning.sh ]]; then
          # Option 1: Remove entirely
          # rm -f /etc/profile.d/00-cloud-init-warning.sh
          
          # Option 2: Keep but it will no-op (since flag file is gone)
          log "Cloud-init warning script will no longer trigger"
      fi
      
      # Create completion marker
      touch /var/lib/cloud/instance/hardening-complete
      log "Created hardening-complete marker"
      
      # Log completion
      log "Cloud-init completion script finished"
      log "System is ready for use"
      
      # Final message to console
      echo ""
      echo "═══════════════════════════════════════════════════════════════"
      echo "  SYSTEM INITIALIZATION COMPLETE"
      echo "═══════════════════════════════════════════════════════════════"
      echo ""
      echo "  The server has been configured and hardened."
      echo "  System will reboot in 60 seconds to apply all changes."
      echo ""
      echo "  After reboot, verify with:"
      echo "    sudo /usr/local/bin/verify-hardening.sh"
      echo "    sudo /usr/local/bin/verify-firewall.sh"
      echo ""
      echo "═══════════════════════════════════════════════════════════════"
      echo ""

  # ===========================================================================
  # WALL MESSAGE SCRIPT (broadcast to all logged-in users)
  # ===========================================================================
  
  - path: /usr/local/bin/cloud-init-wall-message.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # Broadcast message to all logged-in users
      
      MESSAGE="$1"
      
      if command -v wall &>/dev/null; then
          wall <<EOF
      
      ════════════════════════════════════════════════════════════════════
      
      $MESSAGE
      
      ════════════════════════════════════════════════════════════════════
      
      EOF
      fi

  # ===========================================================================
  # PROGRESS DISPLAY SCRIPT
  # ===========================================================================
  
  - path: /usr/local/bin/cloud-init-progress.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # CLOUD-INIT PROGRESS MONITOR
      # =============================================================================
      # Shows real-time progress of cloud-init execution
      # Usage: cloud-init-progress.sh
      # =============================================================================
      
      # Colors
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      CYAN='\033[0;36m'
      NC='\033[0m'
      
      clear
      
      echo -e "${CYAN}═══════════════════════════════════════════════════════════════${NC}"
      echo -e "${CYAN}  CLOUD-INIT PROGRESS MONITOR${NC}"
      echo -e "${CYAN}═══════════════════════════════════════════════════════════════${NC}"
      echo ""
      echo "Press Ctrl+C to exit (cloud-init will continue in background)"
      echo ""
      
      # Function to get current stage
      get_stage() {
          if [[ -f /run/cloud-init/status.json ]] && command -v jq &>/dev/null; then
              jq -r '.v1.stage // "unknown"' /run/cloud-init/status.json 2>/dev/null
          else
              echo "unknown"
          fi
      }
      
      # Function to check if cloud-init is running
      is_running() {
          pgrep -f "cloud-init" > /dev/null 2>&1 || [[ -f /run/cloud-init-in-progress ]]
      }
      
      # Main loop
      while is_running; do
          stage=$(get_stage)
          timestamp=$(date '+%H:%M:%S')
          
          # Get last log line
          if [[ -f /var/log/cloud-init-output.log ]]; then
              last_line=$(tail -1 /var/log/cloud-init-output.log 2>/dev/null | cut -c1-70)
          else
              last_line="Waiting for log..."
          fi
          
          # Clear line and print status
          echo -ne "\r\033[K"
          echo -e "${YELLOW}[$timestamp]${NC} Stage: ${GREEN}$stage${NC}"
          echo -e "  Last: $last_line"
          echo -ne "\033[2A"  # Move cursor up 2 lines
          
          sleep 2
      done
      
      echo -e "\n\n"
      echo -e "${GREEN}═══════════════════════════════════════════════════════════════${NC}"
      echo -e "${GREEN}  CLOUD-INIT COMPLETED${NC}"
      echo -e "${GREEN}═══════════════════════════════════════════════════════════════${NC}"
      echo ""
      
      # Check for errors
      if [[ -f /run/cloud-init/status.json ]] && command -v jq &>/dev/null; then
          errors=$(jq -r '.v1.errors // []' /run/cloud-init/status.json 2>/dev/null)
          if [[ "$errors" != "[]" && "$errors" != "null" ]]; then
              echo -e "${RED}Errors detected:${NC}"
              echo "$errors"
          else
              echo -e "${GREEN}No errors detected${NC}"
          fi
      fi
      
      echo ""
      echo "System will reboot shortly to apply all changes."
      echo ""

# -----------------------------------------------------------------------------
# BOOT COMMANDS (run very early)
# -----------------------------------------------------------------------------
bootcmd:
  # Create flag file immediately
  - touch /run/cloud-init-in-progress
  
  # Set the cloud-init banner immediately
  - |
    if [[ -f /etc/ssh/banner.cloud-init ]]; then
      cp /etc/ssh/banner.cloud-init /etc/ssh/banner
    fi
  - |
    if [[ -f /etc/issue.net.cloud-init ]]; then
      cp /etc/issue.net.cloud-init /etc/issue.net
    fi

# -----------------------------------------------------------------------------
# RUN COMMANDS
# -----------------------------------------------------------------------------
runcmd:
  # Ensure flag file exists
  - touch /run/cloud-init-in-progress
  
  # Broadcast message to any logged-in users
  - /usr/local/bin/cloud-init-wall-message.sh "⚠️  CLOUD-INIT STARTED - System initialization in progress. Please log out and wait for automatic reboot."
  
  # ... (all your other runcmd entries here) ...
  
  # === ADD AT THE VERY END OF RUNCMD ===
  
  # Broadcast completion message
  - /usr/local/bin/cloud-init-wall-message.sh "✓ CLOUD-INIT COMPLETE - System will reboot in 60 seconds to apply changes."
  
  # Run completion script
  - /usr/local/bin/cloud-init-complete.sh
  
  # Log final status
  - echo "Cloud-init runcmd completed at $(date)" >> /var/log/cloud-init-hardening.log

# -----------------------------------------------------------------------------
# FINAL MESSAGE
# -----------------------------------------------------------------------------
final_message: |
  ═══════════════════════════════════════════════════════════════
  CLOUD-INIT COMPLETED
  ═══════════════════════════════════════════════════════════════
  
  Finished at: $TIMESTAMP
  Uptime: $UPTIME
  
  System will reboot automatically to apply all hardening changes.
  
  After reboot, connect and run verification:
    sudo /usr/local/bin/verify-hardening.sh
    sudo /usr/local/bin/verify-firewall.sh
    sudo /usr/local/bin/verify-additional-hardening.sh
  
  ═══════════════════════════════════════════════════════════════

# -----------------------------------------------------------------------------
# AUTOMATIC REBOOT
# -----------------------------------------------------------------------------
power_state:
  delay: "+1"
  mode: reboot
  message: "Cloud-init hardening complete. Rebooting to apply all changes..."
  timeout: 60
  condition: true