#cloud-config
# =============================================================================
# DOCKER HOST HARDENING - CLOUD-INIT CONFIGURATION
# =============================================================================
# This cloud-init configuration hardens a Linux host for Docker/Traefik
# with IPv6 completely disabled.
#
# Tested on: Ubuntu 22.04/24.04, Debian 11/12
# 
# NOTE: A reboot is recommended after first boot to ensure:
#   - GRUB IPv6 disable takes effect
#   - All modules are properly loaded
#   - All sysctl settings are applied
# =============================================================================

# -----------------------------------------------------------------------------
# PACKAGE INSTALLATION
# -----------------------------------------------------------------------------
package_update: true
package_upgrade: true
packages:
  - curl
  - wget
  - gnupg
  - ca-certificates
  - lsb-release
  - conntrack
  - net-tools
  - jq

# -----------------------------------------------------------------------------
# KERNEL MODULES - Load at boot
# -----------------------------------------------------------------------------
write_files:
  # Module loading configuration
  - path: /etc/modules-load.d/docker-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      # Required for bridge netfilter settings
      br_netfilter
      # Required for connection tracking settings
      nf_conntrack
      # Required for iptables NAT
      iptable_nat
      iptable_filter

  # IPv6 module blacklist
  - path: /etc/modprobe.d/disable-ipv6.conf
    owner: root:root
    permissions: '0644'
    content: |
      # Disable IPv6 module
      options ipv6 disable=1
      blacklist ipv6

  # -----------------------------------------------------------------------------
  # SYSCTL HARDENING CONFIGURATION
  # -----------------------------------------------------------------------------
  - path: /etc/sysctl.d/99-docker-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      # =============================================================================
      # DOCKER HOST KERNEL HARDENING CONFIGURATION - NO IPv6
      # Generated by cloud-init
      # =============================================================================
      
      # -----------------------------------------------------------------------------
      # IP FORWARDING - IPv4 ONLY FOR DOCKER
      # -----------------------------------------------------------------------------
      net.ipv4.ip_forward = 1
      
      # -----------------------------------------------------------------------------
      # SOURCE ROUTING - DISABLED
      # -----------------------------------------------------------------------------
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      
      # -----------------------------------------------------------------------------
      # ICMP REDIRECTS - DISABLED
      # -----------------------------------------------------------------------------
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      
      # -----------------------------------------------------------------------------
      # REVERSE PATH FILTERING - LOOSE MODE FOR DOCKER
      # -----------------------------------------------------------------------------
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
      
      # -----------------------------------------------------------------------------
      # MARTIAN LOGGING
      # -----------------------------------------------------------------------------
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1
      
      # -----------------------------------------------------------------------------
      # SYN FLOOD PROTECTION
      # -----------------------------------------------------------------------------
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_max_syn_backlog = 2048
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_syn_retries = 5
      
      # -----------------------------------------------------------------------------
      # ICMP HARDENING
      # -----------------------------------------------------------------------------
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1
      
      # -----------------------------------------------------------------------------
      # KERNEL SECURITY
      # -----------------------------------------------------------------------------
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 1
      kernel.randomize_va_space = 2
      kernel.yama.ptrace_scope = 1
      kernel.panic = 10
      kernel.panic_on_oops = 1
      fs.suid_dumpable = 0
      
      # -----------------------------------------------------------------------------
      # NETWORK BUFFER TUNING
      # -----------------------------------------------------------------------------
      net.core.rmem_max = 134217728
      net.core.wmem_max = 134217728
      net.core.rmem_default = 67108864
      net.core.wmem_default = 67108864
      net.core.netdev_max_backlog = 5000
      net.core.somaxconn = 4096
      
      # -----------------------------------------------------------------------------
      # TCP BUFFER AUTO-TUNING
      # -----------------------------------------------------------------------------
      net.ipv4.tcp_rmem = 4096 87380 134217728
      net.ipv4.tcp_wmem = 4096 65536 134217728
      net.ipv4.tcp_mem = 786432 1048576 1572864
      
      # -----------------------------------------------------------------------------
      # IPV6 - COMPLETELY DISABLED
      # -----------------------------------------------------------------------------
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
      
      # -----------------------------------------------------------------------------
      # FILESYSTEM PROTECTION
      # -----------------------------------------------------------------------------
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1
      fs.protected_fifos = 2
      fs.protected_regular = 2
      
      # -----------------------------------------------------------------------------
      # EPHEMERAL PORTS - PROXY WORKLOADS
      # -----------------------------------------------------------------------------
      net.ipv4.ip_local_port_range = 1024 65535
      
      # -----------------------------------------------------------------------------
      # TCP KEEPALIVE - LONG-LIVED CONNECTIONS
      # -----------------------------------------------------------------------------
      net.ipv4.tcp_keepalive_time = 600
      net.ipv4.tcp_keepalive_intvl = 60
      net.ipv4.tcp_keepalive_probes = 5
      
      # -----------------------------------------------------------------------------
      # TIME_WAIT HANDLING - HIGH CONNECTION VOLUME
      # -----------------------------------------------------------------------------
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.tcp_fin_timeout = 15

  # Bridge-specific sysctl (applied after br_netfilter loads)
  - path: /etc/sysctl.d/99-docker-bridge.conf
    owner: root:root
    permissions: '0644'
    content: |
      # -----------------------------------------------------------------------------
      # BRIDGE NETWORKING - DOCKER (IPv4 only)
      # These require br_netfilter module to be loaded
      # -----------------------------------------------------------------------------
      net.bridge.bridge-nf-call-iptables = 1

  # Conntrack-specific sysctl (applied after nf_conntrack loads)
  - path: /etc/sysctl.d/99-docker-conntrack.conf
    owner: root:root
    permissions: '0644'
    content: |
      # -----------------------------------------------------------------------------
      # CONNECTION TRACKING - TRAEFIK
      # These require nf_conntrack module to be loaded
      # -----------------------------------------------------------------------------
      net.netfilter.nf_conntrack_max = 262144
      net.netfilter.nf_conntrack_tcp_timeout_established = 86400
      net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

  # -----------------------------------------------------------------------------
  # DOCKER DAEMON CONFIGURATION
  # -----------------------------------------------------------------------------
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "ipv6": false,
        "ip6tables": false,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true,
        "userland-proxy": false,
        "default-ulimits": {
          "nofile": {
            "Name": "nofile",
            "Hard": 65536,
            "Soft": 65536
          }
        }
      }

  # -----------------------------------------------------------------------------
  # VERIFICATION SCRIPT
  # -----------------------------------------------------------------------------
  - path: /usr/local/bin/verify-hardening.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # DOCKER HOST HARDENING VERIFICATION SCRIPT
      # =============================================================================
      # Run this script after first boot to verify all hardening settings
      # Usage: sudo /usr/local/bin/verify-hardening.sh
      # =============================================================================
      
      set -euo pipefail
      
      # Colors for output
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[0;34m'
      NC='\033[0m' # No Color
      
      # Counters
      PASS=0
      FAIL=0
      WARN=0
      
      # -----------------------------------------------------------------------------
      # HELPER FUNCTIONS
      # -----------------------------------------------------------------------------
      
      print_header() {
          echo ""
          echo -e "${BLUE}═══════════════════════════════════════════════════════════════${NC}"
          echo -e "${BLUE}  $1${NC}"
          echo -e "${BLUE}═══════════════════════════════════════════════════════════════${NC}"
      }
      
      print_section() {
          echo ""
          echo -e "${YELLOW}--- $1 ---${NC}"
      }
      
      check_sysctl() {
          local key="$1"
          local expected="$2"
          local description="$3"
          local actual
          
          if actual=$(sysctl -n "$key" 2>/dev/null); then
              # Handle multi-value sysctls (like tcp_rmem)
              actual=$(echo "$actual" | tr '\t' ' ' | tr -s ' ')
              expected=$(echo "$expected" | tr '\t' ' ' | tr -s ' ')
              
              if [[ "$actual" == "$expected" ]]; then
                  echo -e "${GREEN}[PASS]${NC} $key = $actual"
                  ((PASS++))
              else
                  echo -e "${RED}[FAIL]${NC} $key = $actual (expected: $expected)"
                  echo -e "       ${description}"
                  ((FAIL++))
              fi
          else
              echo -e "${RED}[FAIL]${NC} $key - Unable to read (module may not be loaded)"
              echo -e "       ${description}"
              ((FAIL++))
          fi
      }
      
      check_module() {
          local module="$1"
          local description="$2"
          
          if lsmod | grep -q "^$module"; then
              echo -e "${GREEN}[PASS]${NC} Module '$module' is loaded"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} Module '$module' is NOT loaded"
              echo -e "       ${description}"
              ((FAIL++))
          fi
      }
      
      check_file_exists() {
          local file="$1"
          local description="$2"
          
          if [[ -f "$file" ]]; then
              echo -e "${GREEN}[PASS]${NC} File exists: $file"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} File missing: $file"
              echo -e "       ${description}"
              ((FAIL++))
          fi
      }
      
      check_file_contains() {
          local file="$1"
          local pattern="$2"
          local description="$3"
          
          if [[ -f "$file" ]] && grep -q "$pattern" "$file" 2>/dev/null; then
              echo -e "${GREEN}[PASS]${NC} $file contains '$pattern'"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} $file does not contain '$pattern'"
              echo -e "       ${description}"
              ((FAIL++))
          fi
      }
      
      check_service() {
          local service="$1"
          local description="$2"
          
          if systemctl is-active --quiet "$service" 2>/dev/null; then
              echo -e "${GREEN}[PASS]${NC} Service '$service' is running"
              ((PASS++))
          else
              echo -e "${YELLOW}[WARN]${NC} Service '$service' is not running"
              echo -e "       ${description}"
              ((WARN++))
          fi
      }
      
      check_ipv6_disabled() {
          local interface="$1"
          
          if ip -6 addr show dev "$interface" 2>/dev/null | grep -q inet6; then
              echo -e "${RED}[FAIL]${NC} IPv6 address found on $interface"
              ((FAIL++))
          else
              echo -e "${GREEN}[PASS]${NC} No IPv6 address on $interface"
              ((PASS++))
          fi
      }
      
      # -----------------------------------------------------------------------------
      # MAIN VERIFICATION
      # -----------------------------------------------------------------------------
      
      print_header "DOCKER HOST HARDENING VERIFICATION"
      echo "Timestamp: $(date)"
      echo "Hostname: $(hostname)"
      echo "Kernel: $(uname -r)"
      
      # -----------------------------------------------------------------------------
      print_section "KERNEL MODULES"
      # -----------------------------------------------------------------------------
      check_module "br_netfilter" "Required for Docker bridge networking"
      check_module "nf_conntrack" "Required for connection tracking"
      
      # Check IPv6 module is NOT loaded (may be compiled in)
      if lsmod | grep -q "^ipv6"; then
          echo -e "${YELLOW}[WARN]${NC} IPv6 module is loaded (may be compiled into kernel)"
          ((WARN++))
      else
          echo -e "${GREEN}[PASS]${NC} IPv6 module is not loaded"
          ((PASS++))
      fi
      
      # -----------------------------------------------------------------------------
      print_section "IP FORWARDING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.ip_forward" "1" "Required for Docker networking"
      
      # -----------------------------------------------------------------------------
      print_section "SOURCE ROUTING (should be disabled)"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.conf.all.accept_source_route" "0" "Prevents routing attacks"
      check_sysctl "net.ipv4.conf.default.accept_source_route" "0" "Prevents routing attacks"
      
      # -----------------------------------------------------------------------------
      print_section "ICMP REDIRECTS (should be disabled)"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.conf.all.accept_redirects" "0" "Prevents MITM attacks"
      check_sysctl "net.ipv4.conf.default.accept_redirects" "0" "Prevents MITM attacks"
      check_sysctl "net.ipv4.conf.all.secure_redirects" "0" "Prevents MITM attacks"
      check_sysctl "net.ipv4.conf.default.secure_redirects" "0" "Prevents MITM attacks"
      check_sysctl "net.ipv4.conf.all.send_redirects" "0" "Prevents redirect injection"
      check_sysctl "net.ipv4.conf.default.send_redirects" "0" "Prevents redirect injection"
      
      # -----------------------------------------------------------------------------
      print_section "REVERSE PATH FILTERING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.conf.all.rp_filter" "2" "Loose mode for Docker"
      check_sysctl "net.ipv4.conf.default.rp_filter" "2" "Loose mode for Docker"
      
      # -----------------------------------------------------------------------------
      print_section "MARTIAN LOGGING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.conf.all.log_martians" "1" "Log suspicious packets"
      check_sysctl "net.ipv4.conf.default.log_martians" "1" "Log suspicious packets"
      
      # -----------------------------------------------------------------------------
      print_section "SYN FLOOD PROTECTION"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.tcp_syncookies" "1" "DDoS protection"
      check_sysctl "net.ipv4.tcp_max_syn_backlog" "2048" "Connection queue size"
      check_sysctl "net.ipv4.tcp_synack_retries" "2" "Faster cleanup"
      check_sysctl "net.ipv4.tcp_syn_retries" "5" "Outbound connection retries"
      
      # -----------------------------------------------------------------------------
      print_section "ICMP HARDENING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.icmp_echo_ignore_broadcasts" "1" "Prevent Smurf attacks"
      check_sysctl "net.ipv4.icmp_ignore_bogus_error_responses" "1" "Ignore malformed ICMP"
      
      # -----------------------------------------------------------------------------
      print_section "KERNEL SECURITY"
      # -----------------------------------------------------------------------------
      check_sysctl "kernel.dmesg_restrict" "1" "Restrict kernel logs"
      check_sysctl "kernel.kptr_restrict" "1" "Hide kernel pointers"
      check_sysctl "kernel.randomize_va_space" "2" "Full ASLR"
      check_sysctl "kernel.yama.ptrace_scope" "1" "Restrict ptrace"
      check_sysctl "kernel.panic" "10" "Auto-reboot on panic"
      check_sysctl "kernel.panic_on_oops" "1" "Panic on kernel oops"
      check_sysctl "fs.suid_dumpable" "0" "No SUID core dumps"
      
      # -----------------------------------------------------------------------------
      print_section "NETWORK BUFFER TUNING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.core.rmem_max" "134217728" "Max receive buffer"
      check_sysctl "net.core.wmem_max" "134217728" "Max send buffer"
      check_sysctl "net.core.rmem_default" "67108864" "Default receive buffer"
      check_sysctl "net.core.wmem_default" "67108864" "Default send buffer"
      check_sysctl "net.core.netdev_max_backlog" "5000" "Network backlog"
      check_sysctl "net.core.somaxconn" "4096" "Socket listen backlog"
      
      # -----------------------------------------------------------------------------
      print_section "TCP BUFFER AUTO-TUNING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.tcp_rmem" "4096 87380 134217728" "TCP receive buffer"
      check_sysctl "net.ipv4.tcp_wmem" "4096 65536 134217728" "TCP send buffer"
      
      # -----------------------------------------------------------------------------
      print_section "IPV6 DISABLED"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv6.conf.all.disable_ipv6" "1" "IPv6 disabled globally"
      check_sysctl "net.ipv6.conf.default.disable_ipv6" "1" "IPv6 disabled by default"
      check_sysctl "net.ipv6.conf.lo.disable_ipv6" "1" "IPv6 disabled on loopback"
      
      # Check no IPv6 addresses exist
      echo ""
      echo "Checking for IPv6 addresses on interfaces..."
      for iface in $(ip -o link show | awk -F': ' '{print $2}' | cut -d'@' -f1); do
          check_ipv6_disabled "$iface"
      done
      
      # -----------------------------------------------------------------------------
      print_section "FILESYSTEM PROTECTION"
      # -----------------------------------------------------------------------------
      check_sysctl "fs.protected_hardlinks" "1" "Hardlink protection"
      check_sysctl "fs.protected_symlinks" "1" "Symlink protection"
      check_sysctl "fs.protected_fifos" "2" "FIFO protection"
      check_sysctl "fs.protected_regular" "2" "Regular file protection"
      
      # -----------------------------------------------------------------------------
      print_section "BRIDGE NETWORKING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.bridge.bridge-nf-call-iptables" "1" "Bridge iptables integration"
      
      # -----------------------------------------------------------------------------
      print_section "CONNECTION TRACKING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.netfilter.nf_conntrack_max" "262144" "Max tracked connections"
      check_sysctl "net.netfilter.nf_conntrack_tcp_timeout_established" "86400" "Established timeout"
      check_sysctl "net.netfilter.nf_conntrack_tcp_timeout_time_wait" "30" "TIME_WAIT timeout"
      
      # -----------------------------------------------------------------------------
      print_section "EPHEMERAL PORTS"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.ip_local_port_range" "1024 65535" "Expanded port range"
      
      # -----------------------------------------------------------------------------
      print_section "TCP KEEPALIVE"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.tcp_keepalive_time" "600" "Keepalive start"
      check_sysctl "net.ipv4.tcp_keepalive_intvl" "60" "Keepalive interval"
      check_sysctl "net.ipv4.tcp_keepalive_probes" "5" "Keepalive probes"
      
      # -----------------------------------------------------------------------------
      print_section "TIME_WAIT HANDLING"
      # -----------------------------------------------------------------------------
      check_sysctl "net.ipv4.tcp_tw_reuse" "1" "TIME_WAIT reuse"
      check_sysctl "net.ipv4.tcp_fin_timeout" "15" "FIN timeout"
      
      # -----------------------------------------------------------------------------
      print_section "CONFIGURATION FILES"
      # -----------------------------------------------------------------------------
      check_file_exists "/etc/sysctl.d/99-docker-hardening.conf" "Main sysctl config"
      check_file_exists "/etc/sysctl.d/99-docker-bridge.conf" "Bridge sysctl config"
      check_file_exists "/etc/sysctl.d/99-docker-conntrack.conf" "Conntrack sysctl config"
      check_file_exists "/etc/modules-load.d/docker-hardening.conf" "Module loading config"
      check_file_exists "/etc/modprobe.d/disable-ipv6.conf" "IPv6 disable config"
      check_file_exists "/etc/docker/daemon.json" "Docker daemon config"
      
      # -----------------------------------------------------------------------------
      print_section "DOCKER CONFIGURATION"
      # -----------------------------------------------------------------------------
      if [[ -f /etc/docker/daemon.json ]]; then
          if command -v jq &>/dev/null; then
              ipv6_setting=$(jq -r '.ipv6 // "not set"' /etc/docker/daemon.json 2>/dev/null)
              if [[ "$ipv6_setting" == "false" ]]; then
                  echo -e "${GREEN}[PASS]${NC} Docker IPv6 is disabled"
                  ((PASS++))
              else
                  echo -e "${RED}[FAIL]${NC} Docker IPv6 is not disabled (value: $ipv6_setting)"
                  ((FAIL++))
              fi
          else
              echo -e "${YELLOW}[WARN]${NC} jq not installed, cannot parse Docker config"
              ((WARN++))
          fi
      fi
      
      # -----------------------------------------------------------------------------
      print_section "SERVICES"
      # -----------------------------------------------------------------------------
      check_service "docker" "Docker should be running for container workloads"
      
      # -----------------------------------------------------------------------------
      print_section "GRUB IPv6 DISABLE"
      # -----------------------------------------------------------------------------
      if [[ -f /etc/default/grub ]]; then
          if grep -q "ipv6.disable=1" /etc/default/grub; then
              echo -e "${GREEN}[PASS]${NC} GRUB IPv6 disable is configured"
              ((PASS++))
          else
              echo -e "${YELLOW}[WARN]${NC} GRUB IPv6 disable not configured (optional but recommended)"
              echo -e "       Add 'ipv6.disable=1' to GRUB_CMDLINE_LINUX and run update-grub"
              ((WARN++))
          fi
      fi
      
      # Check if currently booted with ipv6.disable
      if grep -q "ipv6.disable=1" /proc/cmdline 2>/dev/null; then
          echo -e "${GREEN}[PASS]${NC} Currently booted with ipv6.disable=1"
          ((PASS++))
      else
          echo -e "${YELLOW}[WARN]${NC} Not currently booted with ipv6.disable=1"
          echo -e "       Reboot required for GRUB changes to take effect"
          ((WARN++))
      fi
      
      # -----------------------------------------------------------------------------
      # SUMMARY
      # -----------------------------------------------------------------------------
      print_header "VERIFICATION SUMMARY"
      
      echo ""
      echo -e "  ${GREEN}PASSED:${NC}  $PASS"
      echo -e "  ${RED}FAILED:${NC}  $FAIL"
      echo -e "  ${YELLOW}WARNINGS:${NC} $WARN"
      echo ""
      
      if [[ $FAIL -eq 0 ]]; then
          echo -e "${GREEN}✓ All critical checks passed!${NC}"
          if [[ $WARN -gt 0 ]]; then
              echo -e "${YELLOW}  (Review warnings above for optional improvements)${NC}"
          fi
          exit 0
      else
          echo -e "${RED}✗ Some checks failed. Review the output above.${NC}"
          exit 1
      fi

  # -----------------------------------------------------------------------------
  # HARDENING SUMMARY SCRIPT (for quick reference)
  # -----------------------------------------------------------------------------
  - path: /usr/local/bin/hardening-status.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # Quick status check for hardening
      echo "=== Docker Host Hardening Status ==="
      echo ""
      echo "IPv6 Status:"
      echo "  Disabled (sysctl): $(sysctl -n net.ipv6.conf.all.disable_ipv6 2>/dev/null || echo 'N/A')"
      echo "  Disabled (boot):   $(grep -q ipv6.disable=1 /proc/cmdline && echo '1' || echo '0')"
      echo ""
      echo "IP Forwarding: $(sysctl -n net.ipv4.ip_forward)"
      echo "SYN Cookies:   $(sysctl -n net.ipv4.tcp_syncookies)"
      echo "ASLR:          $(sysctl -n kernel.randomize_va_space)"
      echo ""
      echo "Conntrack:"
      echo "  Max:     $(sysctl -n net.netfilter.nf_conntrack_max 2>/dev/null || echo 'N/A')"
      echo "  Current: $(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || echo 'N/A')"
      echo ""
      echo "Docker: $(systemctl is-active docker 2>/dev/null || echo 'not installed')"
      echo ""
      echo "Run 'verify-hardening.sh' for full verification"

# -----------------------------------------------------------------------------
# BOOT COMMANDS - Run early in boot process
# -----------------------------------------------------------------------------
bootcmd:
  # Load required modules early
  - modprobe br_netfilter || true
  - modprobe nf_conntrack || true

# -----------------------------------------------------------------------------
# RUN COMMANDS - Run after boot
# -----------------------------------------------------------------------------
runcmd:
  # Ensure modules are loaded
  - modprobe br_netfilter
  - modprobe nf_conntrack
  
  # Apply all sysctl settings
  - sysctl --system
  
  # Update GRUB to disable IPv6 at boot (requires reboot to take effect)
  - |
    if [ -f /etc/default/grub ]; then
      if ! grep -q "ipv6.disable=1" /etc/default/grub; then
        sed -i 's/GRUB_CMDLINE_LINUX="\(.*\)"/GRUB_CMDLINE_LINUX="\1 ipv6.disable=1"/' /etc/default/grub
        # Remove any double spaces
        sed -i 's/GRUB_CMDLINE_LINUX="  /GRUB_CMDLINE_LINUX="/g' /etc/default/grub
        update-grub 2>/dev/null || grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null || true
      fi
    fi
  
  # Install Docker if not present
  - |
    if ! command -v docker &>/dev/null; then
      curl -fsSL https://get.docker.com | sh
      systemctl enable docker
      systemctl start docker
    else
      # Restart Docker to pick up daemon.json changes
      systemctl restart docker
    fi
  
  # Create directory for Docker daemon.json if it doesn't exist
  - mkdir -p /etc/docker
  
  # Final sysctl apply (in case modules weren't loaded earlier)
  - sleep 2
  - sysctl --system
  
  # Log completion
  - echo "Docker host hardening completed at $(date)" >> /var/log/cloud-init-hardening.log
  - /usr/local/bin/verify-hardening.sh >> /var/log/cloud-init-hardening.log 2>&1 || true

# -----------------------------------------------------------------------------
# FINAL MESSAGE
# -----------------------------------------------------------------------------
final_message: |
  ===========================================
  Docker Host Hardening Complete
  ===========================================
  
  Cloud-init finished at $TIMESTAMP
  Uptime: $UPTIME
  
  IMPORTANT: A reboot is recommended to ensure:
    - GRUB IPv6 disable takes effect
    - All kernel parameters are fully applied
  
  After reboot, verify with:
    sudo /usr/local/bin/verify-hardening.sh
  
  Quick status:
