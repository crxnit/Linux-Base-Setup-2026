write_files:
  # ... existing files ...

  # -----------------------------------------------------------------------------
  # IPTABLES FIREWALL SCRIPT
  # -----------------------------------------------------------------------------
  - path: /usr/local/bin/configure-firewall.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # IPTABLES FIREWALL FOR DOCKER WEB SERVER
      # =============================================================================
      
      set -euo pipefail
      
      # Configuration
      SSH_PORTS="22 4444"
      LOG_PREFIX="IPT-DROPPED: "
      LOG_RATE_LIMIT="5/minute"
      LOG_RATE_BURST="10"
      ICMP_RATE_LIMIT="10/second"
      ICMP_RATE_BURST="20"
      
      log_info() { echo "[FIREWALL] $1"; }
      
      configure_firewall() {
          log_info "Starting firewall configuration..."
          
          # Flush INPUT/OUTPUT (preserve Docker chains)
          iptables -F INPUT
          iptables -F OUTPUT
          iptables -F LOGGING 2>/dev/null || true
          iptables -F SSH_RATE_LIMIT 2>/dev/null || true
          iptables -X LOGGING 2>/dev/null || true
          iptables -X SSH_RATE_LIMIT 2>/dev/null || true
          
          # Default policies
          iptables -P INPUT DROP
          iptables -P FORWARD ACCEPT
          iptables -P OUTPUT ACCEPT
          
          # Create logging chain
          iptables -N LOGGING
          iptables -A LOGGING -m limit --limit $LOG_RATE_LIMIT --limit-burst $LOG_RATE_BURST \
              -j LOG --log-prefix "$LOG_PREFIX" --log-level 4
          iptables -A LOGGING -j DROP
          
          # Create SSH rate limit chain
          iptables -N SSH_RATE_LIMIT
          iptables -A SSH_RATE_LIMIT -m conntrack --ctstate NEW \
              -m recent --set --name SSH --rsource
          iptables -A SSH_RATE_LIMIT -m conntrack --ctstate NEW \
              -m recent --update --seconds 60 --hitcount 10 --name SSH --rsource -j DROP
          iptables -A SSH_RATE_LIMIT -j ACCEPT
          
          # Loopback
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A OUTPUT -o lo -j ACCEPT
          iptables -A INPUT ! -i lo -s 127.0.0.0/8 -j DROP
          
          # Stateful inspection
          iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          iptables -A INPUT -m conntrack --ctstate INVALID -j DROP
          
          # Anti-spoofing
          iptables -A INPUT -p tcp --tcp-flags ALL NONE -j DROP
          iptables -A INPUT -p tcp --tcp-flags ALL ALL -j DROP
          iptables -A INPUT -p tcp --tcp-flags SYN,FIN SYN,FIN -j DROP
          iptables -A INPUT -p tcp --tcp-flags SYN,RST SYN,RST -j DROP
          iptables -A INPUT -p tcp --tcp-flags FIN,ACK FIN -j DROP
          iptables -A INPUT -p tcp --tcp-flags PSH,ACK PSH -j DROP
          iptables -A INPUT -p tcp --tcp-flags URG,ACK URG -j DROP
          iptables -A INPUT -f -j DROP
          
          # ICMP (rate limited)
          iptables -A INPUT -p icmp --icmp-type echo-request \
              -m limit --limit $ICMP_RATE_LIMIT --limit-burst $ICMP_RATE_BURST -j ACCEPT
          iptables -A INPUT -p icmp --icmp-type echo-reply -j ACCEPT
          iptables -A INPUT -p icmp --icmp-type destination-unreachable -j ACCEPT
          iptables -A INPUT -p icmp --icmp-type time-exceeded -j ACCEPT
          iptables -A INPUT -p icmp --icmp-type parameter-problem -j ACCEPT
          
          # Docker bridge traffic
          iptables -A INPUT -i docker0 -j ACCEPT
          iptables -A INPUT -i br-+ -j ACCEPT
          
          # SSH (rate limited)
          for port in $SSH_PORTS; do
              iptables -A INPUT -p tcp --dport "$port" -m conntrack --ctstate NEW -j SSH_RATE_LIMIT
          done
          
          # HTTP/HTTPS
          iptables -A INPUT -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
          iptables -A INPUT -p tcp --dport 443 -m conntrack --ctstate NEW -j ACCEPT
          
          # DOCKER-USER chain
          iptables -N DOCKER-USER 2>/dev/null || true
          iptables -F DOCKER-USER
          iptables -A DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          iptables -A DOCKER-USER -p tcp --dport 80 -j RETURN
          iptables -A DOCKER-USER -p tcp --dport 443 -j RETURN
          iptables -A DOCKER-USER -i docker0 -o docker0 -j RETURN
          iptables -A DOCKER-USER -i br-+ -o br-+ -j RETURN
          iptables -A DOCKER-USER -i br-+ -o docker0 -j RETURN
          iptables -A DOCKER-USER -i docker0 -o br-+ -j RETURN
          iptables -A DOCKER-USER -j RETURN
          
          # Final drop with logging
          iptables -A INPUT -j LOGGING
          
          log_info "Firewall configuration complete"
      }
      
      save_rules() {
          log_info "Saving firewall rules..."
          mkdir -p /etc/iptables
          iptables-save > /etc/iptables/rules.v4
          log_info "Rules saved to /etc/iptables/rules.v4"
      }
      
      # Main
      configure_firewall
      save_rules

  # -----------------------------------------------------------------------------
  # IPTABLES RESTORE SERVICE
  # -----------------------------------------------------------------------------
  - path: /etc/systemd/system/iptables-restore.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Restore iptables firewall rules
      Before=network-pre.target
      Wants=network-pre.target
      After=docker.service
      
      [Service]
      Type=oneshot
      ExecStart=/sbin/iptables-restore /etc/iptables/rules.v4
      ExecReload=/sbin/iptables-restore /etc/iptables/rules.v4
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target

  # -----------------------------------------------------------------------------
  # FIREWALL VERIFICATION SCRIPT
  # -----------------------------------------------------------------------------
  - path: /usr/local/bin/verify-firewall.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # =============================================================================
      # IPTABLES FIREWALL VERIFICATION
      # =============================================================================
      
      set -euo pipefail
      
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[0;34m'
      NC='\033[0m'
      
      PASS=0
      FAIL=0
      WARN=0
      
      print_header() {
          echo ""
          echo -e "${BLUE}═══════════════════════════════════════════════════════════════${NC}"
          echo -e "${BLUE}  $1${NC}"
          echo -e "${BLUE}═══════════════════════════════════════════════════════════════${NC}"
      }
      
      print_section() {
          echo ""
          echo -e "${YELLOW}--- $1 ---${NC}"
      }
      
      check_policy() {
          local chain="$1"
          local expected="$2"
          local actual
          
          actual=$(iptables -L "$chain" -n | head -1 | grep -oP '\(policy \K[A-Z]+')
          
          if [[ "$actual" == "$expected" ]]; then
              echo -e "${GREEN}[PASS]${NC} $chain policy is $actual"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} $chain policy is $actual (expected: $expected)"
              ((FAIL++))
          fi
      }
      
      check_chain_exists() {
          local chain="$1"
          
          if iptables -L "$chain" -n &>/dev/null; then
              echo -e "${GREEN}[PASS]${NC} Chain '$chain' exists"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} Chain '$chain' does not exist"
              ((FAIL++))
          fi
      }
      
      check_rule_exists() {
          local description="$1"
          local pattern="$2"
          
          if iptables-save | grep -qE "$pattern"; then
              echo -e "${GREEN}[PASS]${NC} $description"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} $description"
              ((FAIL++))
          fi
      }
      
      check_port_allowed() {
          local port="$1"
          local proto="${2:-tcp}"
          
          if iptables-save | grep -qE "dport $port.*ACCEPT|dport $port.*RETURN|dport $port.*SSH_RATE_LIMIT"; then
              echo -e "${GREEN}[PASS]${NC} Port $port/$proto is allowed"
              ((PASS++))
          else
              echo -e "${RED}[FAIL]${NC} Port $port/$proto is NOT allowed"
              ((FAIL++))
          fi
      }
      
      # Main verification
      print_header "IPTABLES FIREWALL VERIFICATION"
      echo "Timestamp: $(date)"
      
      print_section "DEFAULT POLICIES"
      check_policy "INPUT" "DROP"
      check_policy "FORWARD" "ACCEPT"
      check_policy "OUTPUT" "ACCEPT"
      
      print_section "CUSTOM CHAINS"
      check_chain_exists "LOGGING"
      check_chain_exists "SSH_RATE_LIMIT"
      check_chain_exists "DOCKER-USER"
      
      print_section "ALLOWED PORTS"
      check_port_allowed "22"
      check_port_allowed "80"
      check_port_allowed "443"
      check_port_allowed "4444"
      
      print_section "ESSENTIAL RULES"
      check_rule_exists "Loopback allowed" "INPUT.*-i lo.*ACCEPT"
      check_rule_exists "Established connections allowed" "ESTABLISHED,RELATED.*ACCEPT"
      check_rule_exists "Invalid packets dropped" "INVALID.*DROP"
      check_rule_exists "Docker bridge allowed" "INPUT.*docker0.*ACCEPT"
      check_rule_exists "ICMP echo-request allowed" "icmp.*echo-request.*ACCEPT"
      check_rule_exists "Final logging rule" "INPUT.*LOGGING"
      
      print_section "ANTI-SPOOFING RULES"
      check_rule_exists "NULL packets dropped" "tcp-flags.*NONE.*DROP"
      check_rule_exists "XMAS packets dropped" "tcp-flags.*ALL.*DROP"
      check_rule_exists "SYN-FIN dropped" "SYN,FIN.*SYN,FIN.*DROP"
      
      print_section "SSH RATE LIMITING"
      check_rule_exists "SSH rate limit chain used" "dport 22.*SSH_RATE_LIMIT"
      check_rule_exists "SSH recent module" "recent.*SSH"
      
      print_section "PERSISTENCE"
      if [[ -f /etc/iptables/rules.v4 ]]; then
          echo -e "${GREEN}[PASS]${NC} Rules file exists: /etc/iptables/rules.v4"
          ((PASS++))
          
          local rule_count=$(grep -c "^-A" /etc/iptables/rules.v4 2>/dev/null || echo "0")
          echo -e "       Contains $rule_count rules"
      else
          echo -e "${RED}[FAIL]${NC} Rules file missing: /etc/iptables/rules.v4"
          ((FAIL++))
      fi
      
      if systemctl is-enabled iptables-restore.service &>/dev/null; then
          echo -e "${GREEN}[PASS]${NC} iptables-restore service is enabled"
          ((PASS++))
      else
          echo -e "${YELLOW}[WARN]${NC} iptables-restore service is not enabled"
          ((WARN++))
      fi
      
      print_section "CURRENT RULE COUNTS"
      echo "  INPUT chain:       $(iptables -L INPUT -n | tail -n +3 | wc -l) rules"
      echo "  FORWARD chain:     $(iptables -L FORWARD -n | tail -n +3 | wc -l) rules"
      echo "  DOCKER-USER chain: $(iptables -L DOCKER-USER -n 2>/dev/null | tail -n +3 | wc -l) rules"
      
      print_section "RECENT DROPPED PACKETS"
      if journalctl -k --since "1 hour ago" 2>/dev/null | grep -q "IPT-DROPPED"; then
          echo "  Dropped packets in last hour:"
          journalctl -k --since "1 hour ago" 2>/dev/null | grep "IPT-DROPPED" | tail -5 | while read line; do
              echo "    $line"
          done
      else
          echo "  No dropped packets logged in the last hour"
      fi
      
      # Summary
      print_header "SUMMARY"
      echo ""
      echo -e "  ${GREEN}PASSED:${NC}   $PASS"
      echo -e "  ${RED}FAILED:${NC}   $FAIL"
      echo -e "  ${YELLOW}WARNINGS:${NC} $WARN"
      echo ""
      
      if [[ $FAIL -eq 0 ]]; then
          echo -e "${GREEN}✓ All firewall checks passed!${NC}"
          exit 0
      else
          echo -e "${RED}✗ Some checks failed${NC}"
          exit 1
      fi

runcmd:
  # ... existing commands ...
  
  # Configure iptables firewall
  - |
    # Wait for Docker to be ready (it creates DOCKER-USER chain)
    for i in {1..30}; do
      if systemctl is-active docker &>/dev/null; then
        break
      fi
      sleep 2
    done
    sleep 5  # Give Docker time to set up its chains
  
  # Run firewall configuration
  - /usr/local/bin/configure-firewall.sh
  
  # Enable iptables restore on boot
  - systemctl daemon-reload
  - systemctl enable iptables-restore.service
  
  # Log firewall status
  - /usr/local/bin/verify-firewall.sh >> /var/log/cloud-init-hardening.log 2>&1 || true